name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f app/kiosk.keystore ]; then
            echo "Generating permanent signing keystore..."
            keytool -genkeypair -v \
              -keystore app/kiosk.keystore \
              -alias kiosk \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass kioskpassword \
              -keypass kioskpassword \
              -dname "CN=Kiosk Browser, O=Kiosk, C=RU"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/kiosk.keystore
            git commit -m "chore: commit permanent signing keystore for updates" || true
            git push origin main || true
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskBrowser-v${{ steps.get_version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases (OTA Auto-Update)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Kiosk Browser v${{ steps.get_version.outputs.version }}
          body: |
            Обновление Kiosk Browser v${{ steps.get_version.outputs.version }}:
            - Автоматический запрос выбора лаунчера по умолчанию при каждом повторном заходе в Kiosk Browser (если активен One UI / другой рабочий стол)
            - Полная аппаратная и программная блокировка кнопок «Назад», «Домой» и «Недавние» (KEYCODE_APP_SWITCH) при выборе Kiosk
            - Включение LOCK_TASK_FEATURE_NONE, setStatusBarDisabled и блокировка навигации при назначении Kiosk лаунчером по умолчанию
            - Перехват попыток свернуть Kiosk через onUserLeaveHint() и закрытие шторки через ACTION_CLOSE_SYSTEM_DIALOGS
            - Мгновенный выход на рабочий стол One UI из меню настроек и при выборе стороннего лаунчера
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
