name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskBrowser-v${{ steps.get_version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases (OTA Auto-Update)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Kiosk Browser v${{ steps.get_version.outputs.version }}
          body: |
            Обновление Kiosk Browser v${{ steps.get_version.outputs.version }}:
            - Блокировка выделения текста на веб-страницах (запрет вызова лупы, копирования и контекстных меню)
            - Функция автосохранения и запоминания паролей пользователей в браузере
            - Встроенный диалог управления Wi-Fi сетями: запрещен переход в общие системные настройки планшета
            - Автоматическая фоновая проверка обновлений (каждые 15 минут) для моментального появления значка обновления на всех устройствах
            - Автоматическое именование APK файлов с указанием версии (kiosk-browser-v${{ steps.get_version.outputs.version }}.apk)
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
