name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskBrowser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases (OTA Auto-Update)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Kiosk Browser v1.0.1
          body: |
            Автоматическая сборка Kiosk Browser.
            - Компактный горизонтальный статус-бар в правом углу (отступ 2 см)
            - Поддержка свайпа сверху вниз (Pull-to-refresh)
            - Авто-пробуждение экрана при заказе
            - Модуль автообновления приложения по воздуху (OTA)
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}