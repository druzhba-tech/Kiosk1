name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskBrowser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases (OTA Auto-Update)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Kiosk Browser v1.0.6
          body: |
            Обновление Kiosk Browser v1.0.6:
            - Убраны лишние надписи с панели: оставлена только чистая иконка обновления
            - Исправлен запрос назначения лаунчера по умолчанию (вызов системного диалога / автоустановка для Device Owner)
            - Разделены intent-filter для правильного перехвата кнопки HOME
            - Фоновое скачивание и установка в один клик
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
